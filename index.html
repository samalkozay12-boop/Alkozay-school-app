<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>داشبورد - Alkozay School App</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <!-- منوی کناری -->
    <div class="sidebar">
        <div style="text-align: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #334155;">
            <h2 style="color: white; font-size: 18px;">Alkozay School</h2>
        </div>
        <a href="/" class="active">داشبورد</a>
        <a href="/students-page">دانش‌آموزان</a>
        <a href="/teachers-page">معلمان</a>
        <a href="/classes-page">صنف‌ها</a>
        <a href="/subjects-page">مضامین</a>
        <a href="/enrollments-page">ثبت‌نام‌ها</a>
        <a href="/results-page">نمرات</a>
        <a href="/teacher-assignments">تخصیص مضامین</a>
        <a href="/attendance-page">حاضری</a>
        <a href="#" onclick="logout()" style="color: #ef4444; margin-top: 20px; border-top: 1px solid #334155; padding-top: 15px;">خروج از حساب</a>
    </div>

    <!-- محتوای اصلی -->
    <div class="main-content">
        <div class="top-bar">
            <div>
                <h1 style="font-size: 20px; color: var(--primary);">داشبورد مدیریت</h1>
            </div>
            <div class="profile">
                <span id="profileName">مدیر سیستم</span>
                <div class="avatar">A</div>
            </div>
        </div>

        <div class="stats-grid" id="stats-output">
            <!-- کارت‌ها اینجا لود می‌شن -->
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            <div class="card">
                <h3 style="margin-bottom: 15px; color: var(--primary); font-size: 16px;">آخرین دانش‌آموزان</h3>
                <div id="recent-students">...</div>
            </div>
            <div class="card">
                <h3 style="margin-bottom: 15px; color: var(--primary); font-size: 16px;">آخرین نمرات</h3>
                <div id="recent-results">...</div>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        const role = localStorage.getItem('role');
        if (!token || role !== 'admin') window.location.href = '/login';

        function logout() { localStorage.clear(); window.location.href = '/login'; }

        async function loadDashboard() {
            try {
                const response = await fetch('/dashboard/', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const data = await response.json();
                
                // آمار
                let statsHtml = '';
                statsHtml += `<div class="stat-card"><div class="number">${data.total.students}</div><div class="label">دانش‌آموزان</div></div>`;
                statsHtml += `<div class="stat-card"><div class="number">${data.total.teachers}</div><div class="label">معلمان</div></div>`;
                statsHtml += `<div class="stat-card"><div class="number">${data.total.classes}</div><div class="label">صنف‌ها</div></div>`;
                statsHtml += `<div class="stat-card"><div class="number">${data.total.subjects}</div><div class="label">مضامین</div></div>`;
                statsHtml += `<div class="stat-card"><div class="number">${data.total.enrollments}</div><div class="label">ثبت‌نام‌ها</div></div>`;
                document.getElementById('stats-output').innerHTML = statsHtml;

                // آخرین دانش‌آموزان
                let studentsHtml = '';
                if (data.recent_students.length === 0) studentsHtml = '<div style="color:#64748b">موردی یافت نشد.</div>';
                data.recent_students.forEach(s => {
                    studentsHtml += `<div style="padding: 10px 0; border-bottom: 1px solid var(--border);">${s.name}</div>`;
                });
                document.getElementById('recent-students').innerHTML = studentsHtml;

                // آخرین نمرات
                let resultsHtml = '';
                if (data.recent_results.length === 0) resultsHtml = '<div style="color:#64748b">موردی یافت نشد.</div>';
                data.recent_results.forEach(r => {
                    resultsHtml += `<div style="padding: 10px 0; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between;"><span>${r.student_name} (${r.subject_name})</span><b>${r.score}</b></div>`;
                });
                document.getElementById('recent-results').innerHTML = resultsHtml;

            } catch (error) {
                document.getElementById('stats-output').innerHTML = `<div style="color:red">خطا در دریافت اطلاعات</div>`;
            }
        }

        if (token && role === 'admin') loadDashboard();
    </script>
</body>
</html>
