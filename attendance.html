<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاضری</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Tahoma, sans-serif; }
        body { background-color: #f4f6f8; padding: 20px; color: #333; }
        .top-header { display: flex; justify-content: flex-end; align-items: center; margin-bottom: 15px; position: relative; }
        .user-profile { display: flex; align-items: center; gap: 10px; cursor: pointer; background: white; padding: 5px 15px; border-radius: 20px; border: 1px solid #ddd; }
        .avatar { width: 35px; height: 35px; background: #2c3e50; color: white; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: bold; }
        .profile-menu { display: none; position: absolute; top: 50px; left: 0; background: white; border: 1px solid #ddd; border-radius: 4px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); z-index: 100; width: 150px; }
        .profile-menu a { display: block; padding: 10px; text-decoration: none; color: #333; font-size: 14px; text-align: right; }
        .profile-menu a:hover { background: #f4f6f8; }
        .nav { display: flex; justify-content: center; gap: 8px; margin-bottom: 25px; flex-wrap: wrap; }
        .nav a { text-decoration: none; background: #fff; color: #555; padding: 8px 16px; border-radius: 4px; border: 1px solid #ddd; font-size: 14px; }
        .nav a.active { background: #2c3e50; color: white; border-color: #2c3e50; }
        h1 { color: #2c3e50; font-size: 22px; margin-bottom: 20px; border-bottom: 2px solid #ddd; padding-bottom: 10px; }
        .filter-box { background: white; padding: 20px; border-radius: 6px; border: 1px solid #e0e0e0; margin-bottom: 20px; }
        .filter-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        select, input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-family: Tahoma; }
        table { width: 100%; border-collapse: collapse; background: white; border: 1px solid #ddd; border-radius: 6px; overflow: hidden; margin-top: 20px; }
        th, td { padding: 12px 15px; text-align: right; border-bottom: 1px solid #eee; font-size: 14px; }
        th { background: #f8f9fa; color: #2c3e50; font-weight: bold; border-bottom: 2px solid #ddd; }
        .btn-save { background: #27ae60; color: white; border: none; padding: 12px; border-radius: 4px; cursor: pointer; font-family: Tahoma; margin-top: 15px; font-weight: bold; width: 100%; }
        .msg { padding: 10px; margin-bottom: 15px; border-radius: 4px; text-align: center; display: none; font-size: 14px; }
        .msg.success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .msg.error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>
    <div class="top-header">
        <div class="user-profile" onclick="toggleProfileMenu()">
            <span id="profileName">در حال بارگذاری...</span>
            <div class="avatar" id="avatarLetter">U</div>
        </div>
        <div class="profile-menu" id="profileMenu">
            <a href="#" onclick="logout()" style="color: #e74c3c;">خروج از حساب</a>
        </div>
    </div>
    <div class="nav">
        <a href="/">داشبورد</a>
        <a href="/students-page">دانش‌آموزان</a>
        <a href="/teachers-page">معلمان</a>
        <a href="/classes-page">صنف‌ها</a>
        <a href="/subjects-page">مضامین</a>
        <a href="/enrollments-page">ثبت‌نام‌ها</a>
        <a href="/results-page">نمرات</a>
        <a href="/teacher-assignments">تخصیص مضامین</a>
        <a href="/attendance-page" class="active">حاضری</a>
    </div>

    <h1>ثبت حاضری</h1>
    <div class="msg" id="message"></div>

    <div class="filter-box">
        <div class="filter-row">
            <div>
                <label>صنف</label>
                <select id="classSelect" onchange="loadAttendance()">
                    <option value="">انتخاب صنف...</option>
                </select>
            </div>
            <div>
                <label>تاریخ</label>
                <input type="date" id="dateInput" onchange="loadAttendance()">
            </div>
        </div>
    </div>

    <div id="output"></div>

    <script>
        const originalFetch = window.fetch;
        window.fetch = function() {
            let [resource, config] = arguments;
            if (!config) config = {};
            if (!config.headers) config.headers = {};
            const token = localStorage.getItem('token');
            if (token) config.headers['Authorization'] = 'Bearer ' + token;
            if (!config.headers['Content-Type'] && config.method && config.method !== 'GET') config.headers['Content-Type'] = 'application/json';
            return originalFetch(resource, config);
        };

        const token = localStorage.getItem('token');
        const role = localStorage.getItem('role');
        if (!token || (role !== 'admin' && role !== 'teacher')) window.location.href = '/login';

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('profileName').innerText = role === 'admin' ? 'مدیر سیستم' : 'استاد';
            document.getElementById('avatarLetter').innerText = role === 'admin' ? 'A' : 'T';
            // تنظیم تاریخ امروز
            document.getElementById('dateInput').value = new Date().toISOString().split('T')[0];
        });

        function toggleProfileMenu() { const m = document.getElementById('profileMenu'); m.style.display = m.style.display === 'block' ? 'none' : 'block'; }
        function logout() { localStorage.clear(); window.location.href = '/login'; }

        async function loadClasses() {
            try {
                const res = await fetch('http://127.0.0.1:8000/classes/');
                const classes = await res.json();
                let html = '<option value="">انتخاب صنف...</option>';
                classes.forEach(c => html += `<option value="${c.id}">${c.class_name}</option>`);
                document.getElementById('classSelect').innerHTML = html;
            } catch (e) { alert('خطا در بارگذاری صنف‌ها'); }
        }

        async function loadAttendance() {
            const classId = document.getElementById('classSelect').value;
            const date = document.getElementById('dateInput').value;
            const output = document.getElementById('output');

            if (!classId || !date) { output.innerHTML = ''; return; }

            try {
                const res = await fetch(`http://127.0.0.1:8000/attendance/class/${classId}/date/${date}`);
                const students = await res.json();

                if (students.length === 0) {
                    output.innerHTML = '<div style="color:#777">هیچ دانش‌آموزی در این صنف نیست.</div>';
                    return;
                }

                let html = '<table><tr><th>شماره</th><th>نام دانش‌آموز</th><th>وضعیت</th></tr>';
                students.forEach((s, index) => {
                    let currentStatus = s.status || 'present'; 
                    html += `<tr>
                        <td>${index + 1}</td>
                        <td>${s.student_name}</td>
                        <td>
                            <select class="status-select" id="status_${s.enrollment_id}">
                                <option value="present" ${currentStatus === 'present' ? 'selected' : ''}>حاضر</option>
                                <option value="absent" ${currentStatus === 'absent' ? 'selected' : ''}>غیر حاضر</option>
                                <option value="excused" ${currentStatus === 'excused' ? 'selected' : ''}>رخصت</option>
                                <option value="sick" ${currentStatus === 'sick' ? 'selected' : ''}>مریض</option>
                            </select>
                        </td>
                    </tr>`;
                });
                html += '</table>';
                html += `<button class="btn-save" onclick="saveAllAttendance()">ذخیره حاضری</button>`;
                output.innerHTML = html;

            } catch (e) { output.innerHTML = `<div style="color:red">خطا در دریافت اطلاعات</div>`; }
        }

        async function saveAllAttendance() {
            const date = document.getElementById('dateInput').value;
            const selects = document.querySelectorAll('.status-select');
            const msg = document.getElementById('message');
            
            let success = 0;
            for (let sel of selects) {
                const enrollmentId = sel.id.replace('status_', '');
                const status = sel.value;
                try {
                    const res = await fetch('http://127.0.0.1:8000/attendance/', {
                        method: 'POST',
                        body: JSON.stringify({ enrollment_id: parseInt(enrollmentId), date: date, status: status })
                    });
                    if (res.ok) success++;
                } catch (e) {}
            }
            msg.className = 'msg success'; msg.style.display = 'block'; 
            msg.innerText = `✅ حاضری ${success} دانش‌آموز ثبت شد.`;
        }

        if (token) loadClasses();
    </script>
</body>
</html>
