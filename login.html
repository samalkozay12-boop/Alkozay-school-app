<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود به سیستم - Alkozay School</title>
    <style>
        :root { --primary: #1e293b; --secondary: #3b82f6; --bg: #f1f5f9; --text: #334155; --border: #e2e8f0; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Tahoma, sans-serif; }
        body { background-color: var(--bg); display: flex; justify-content: center; align-items: center; height: 100vh; color: var(--text); }
        .login-box { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); border: 1px solid var(--border); width: 100%; max-width: 400px; }
        h2 { color: var(--primary); text-align: center; margin-bottom: 10px; font-size: 22px; }
        p.sub { text-align: center; color: #64748b; margin-bottom: 30px; font-size: 14px; }
        label { display: block; margin-bottom: 8px; font-size: 13px; font-weight: bold; }
        input { width: 100%; padding: 12px 15px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 8px; font-family: Tahoma; transition: 0.2s; }
        input:focus { border-color: var(--secondary); outline: none; }
        button { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; font-family: Tahoma; font-size: 15px; font-weight: bold; transition: 0.2s; }
        button:hover { background: #0f172a; }
        .error { color: #ef4444; background: #fee2e2; padding: 10px; border-radius: 8px; text-align: center; margin-bottom: 20px; display: none; font-size: 13px; border: 1px solid #fecaca; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Alkozay School App</h2>
        <p class="sub">سیستم مدیریت مکتب</p>
        <div class="error" id="errorMsg"></div>
        <label>نام کاربری</label>
        <input type="text" id="username" placeholder="نام کاربری خود را وارد کنید">
        <label>رمز عبور</label>
        <input type="password" id="password" placeholder="رمز عبور خود را وارد کنید">
        <button onclick="login()">ورود به سیستم</button>
    </div>
    <script>
        const API_URL = "https://alkozay-school-app.onrender.com";
        async function login() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorMsg = document.getElementById('errorMsg');
            if (!username || !password) { errorMsg.style.display = 'block'; errorMsg.innerText = 'لطفاً همه فیلدها را پر کنید.'; return; }
            try {
                const response = await fetch(API_URL + '/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: username, password: password })
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.detail || 'خطا در ورود');
                localStorage.setItem('token', data.access_token);
                localStorage.setItem('role', data.role);
                localStorage.setItem('user_id', data.username);
                if (data.role === 'admin') window.location.href = '/';
                else if (data.role === 'teacher') window.location.href = '/results-page';
                else window.location.href = '/student-panel';
            } catch (error) {
                errorMsg.style.display = 'block';
                errorMsg.innerText = error.message;
            }
        }
    </script>
</body>
</html>
